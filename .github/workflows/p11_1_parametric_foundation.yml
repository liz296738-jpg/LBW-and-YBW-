name: P11.1 Parametric Study Foundation

on:
  workflow_dispatch:

jobs:
  formal-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Prepare runtime artifact directory
        run: mkdir -p artifacts/p11_1
      - name: Run full regression
        id: full_pytest
        continue-on-error: true
        run: pytest -q --junitxml=artifacts/p11_1/pytest.xml
      - name: Run exact-SHA P11.1 formal pilot
        env:
          P11_1_PYTEST_OUTCOME: ${{ steps.full_pytest.outcome }}
        run: python cases/studies/p11_1_parametric_foundation.py
      - name: Upload P11.1 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p11-1-parametric-foundation-${{ github.sha }}
          path: artifacts/p11_1/
          if-no-files-found: warn
          retention-days: 30
