name: P14 Project-Defined Inlet Mach Sensitivity

on:
  push:
    branches: [main]
    paths:
      - 'cases/studies/p14_project_defined_inlet_mach_sensitivity.py'
      - 'cases/studies/p11_4_project_defined_h2_smoke.py'
      - 'cases/studies/data/p14_inlet_mach_sensitivity_definition.json'
      - 'cases/studies/data/p14_inlet_mach_literature_context.json'
      - 'tests/test_p14_project_defined_inlet_mach_sensitivity.py'
      - 'src/scramjet1d/**'
      - '.github/workflows/p14_project_defined_inlet_mach_sensitivity.yml'
  pull_request:
    paths:
      - 'cases/studies/p14_project_defined_inlet_mach_sensitivity.py'
      - 'cases/studies/p11_4_project_defined_h2_smoke.py'
      - 'tests/test_p14_project_defined_inlet_mach_sensitivity.py'
      - 'src/scramjet1d/**'
      - '.github/workflows/p14_project_defined_inlet_mach_sensitivity.yml'
  workflow_dispatch:

jobs:
  solve-point:
    name: Mach=${{ matrix.target_mach }}, N=${{ matrix.cells }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target_mach: ['2.0', '2.2', '2.4', '2.6']
        cells: [20, 40]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run one frozen inlet-Mach point
        env:
          TARGET_MACH: ${{ matrix.target_mach }}
          CELLS: ${{ matrix.cells }}
        run: |
          python - <<'PY'
          from dataclasses import asdict
          import json
          import math
          import os
          from pathlib import Path

          from cases.studies import p11_4_project_defined_h2_smoke as baseline
          from cases.studies import p14_project_defined_inlet_mach_sensitivity as study

          target = float(os.environ["TARGET_MACH"])
          cells = int(os.environ["CELLS"])
          point = study.run_point(target, cells)

          if not math.isclose(
              point.actual_inlet_mach, target, rel_tol=2.0e-12, abs_tol=2.0e-12
          ):
              raise SystemExit("actual inlet Mach does not match frozen target")

          allowed = {study.STATUS_CONVERGED, study.STATUS_FORWARD_FLOW_GUARD}
          if point.status not in allowed:
              raise SystemExit(
                  f"unexpected P14 status at Mach={target}, cells={cells}: {point.status}"
              )

          if point.status == study.STATUS_FORWARD_FLOW_GUARD:
              if point.converged or not point.note:
                  raise SystemExit("guarded point metadata is inconsistent")
              if "forward axial flow" not in point.note:
                  raise SystemExit("guarded point does not preserve existing guard")
          else:
              if not point.converged:
                  raise SystemExit("CONVERGED point has converged=false")
              if point.density_change > baseline.DEFAULT_DENSITY_CHANGE_TOLERANCE:
                  raise SystemExit(
                      "project tolerance on teacher Eq.11.46 metric failed"
                  )
              if (
                  not math.isfinite(point.normalized_residual)
                  or point.normalized_residual < 0.0
              ):
                  raise SystemExit("normalized residual diagnostic is invalid")
              if point.mass_inventory_relative_to_inlet > 5.0e-3:
                  raise SystemExit(
                      "project-defined 0.5% mass-inventory QA gate failed"
                  )
              for value in (
                  point.momentum_inventory_relative_to_inlet,
                  point.energy_inventory_relative_to_inlet,
              ):
                  if not math.isfinite(value) or value < 0.0:
                      raise SystemExit("conservation diagnostic is invalid")
              if point.min_pressure_Pa <= 0.0 or point.min_temperature_K <= 0.0:
                  raise SystemExit("converged point has non-positive physical state")
              for value in (
                  point.min_mach,
                  point.max_mach,
                  point.max_pressure_Pa,
                  point.max_temperature_K,
              ):
                  if not math.isfinite(value):
                      raise SystemExit("converged point contains non-finite output")

          safe_mach = os.environ["TARGET_MACH"].replace(".", "p")
          output = Path(f"p14_point_M_{safe_mach}_N_{cells}.json")
          output.write_text(
              json.dumps(asdict(point), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(output.read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p14-point-M-${{ matrix.target_mach }}-N-${{ matrix.cells }}
          path: p14_point_*.json

  aggregate:
    name: Aggregate P14 evidence
    needs: solve-point
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: p14-point-*
          path: p14-points
          merge-multiple: true
      - name: Aggregate and validate without rerunning CFD
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          from cases.studies import p11_4_project_defined_h2_smoke as baseline
          from cases.studies import p14_project_defined_inlet_mach_sensitivity as study
          from cases.studies.teacher_thermochemistry_database import build_species_database
          from scramjet1d.teacher_combustion import fuel_stoichiometric_ratio

          files = sorted(Path("p14-points").glob("p14_point_*.json"))
          expected = {
              (mach, cells)
              for mach in study.PROJECT_TARGET_MACH_VALUES
              for cells in study.PROJECT_CELL_COUNTS
          }
          if len(files) != len(expected):
              raise SystemExit(
                  f"expected {len(expected)} point artifacts, found {len(files)}"
              )

          points = [
              study.InletMachPoint(**json.loads(path.read_text(encoding="utf-8")))
              for path in files
          ]
          actual = {(row.target_inlet_mach, row.cells) for row in points}
          if actual != expected:
              raise SystemExit("P14 point-artifact matrix is incomplete or duplicated")

          allowed = {study.STATUS_CONVERGED, study.STATUS_FORWARD_FLOW_GUARD}
          if any(row.status not in allowed for row in points):
              raise SystemExit("P14 contains MAX_STEPS or another unexpected status")

          species = build_species_database()
          expected_sound_speed = study.inlet_sound_speed_m_per_s(species)
          expected_fuel_air = (
              baseline.EQUIVALENCE_RATIO * fuel_stoichiometric_ratio("H2")
          )

          for row in points:
              if not math.isclose(
                  row.actual_inlet_mach,
                  row.target_inlet_mach,
                  rel_tol=2.0e-12,
                  abs_tol=2.0e-12,
              ):
                  raise SystemExit("target/actual inlet Mach contract drifted")
              if not math.isclose(
                  row.inlet_velocity_m_per_s / row.target_inlet_mach,
                  expected_sound_speed,
                  rel_tol=2.0e-12,
                  abs_tol=2.0e-12,
              ):
                  raise SystemExit("fixed-static-state sound-speed contract drifted")
              if not math.isclose(
                  row.fuel_mass_source_kg_per_s / row.inlet_air_mass_flow_kg_per_s,
                  expected_fuel_air,
                  rel_tol=2.0e-12,
                  abs_tol=2.0e-12,
              ):
                  raise SystemExit("frozen equivalence-ratio mass-flow contract drifted")

              if row.status == study.STATUS_FORWARD_FLOW_GUARD:
                  if row.converged or not row.note or "forward axial flow" not in row.note:
                      raise SystemExit("guarded point metadata is inconsistent")
                  continue

              if not row.converged:
                  raise SystemExit("CONVERGED point has converged=false")
              if row.density_change > baseline.DEFAULT_DENSITY_CHANGE_TOLERANCE:
                  raise SystemExit("teacher Eq.11.46 project tolerance failed")
              if row.mass_inventory_relative_to_inlet > 5.0e-3:
                  raise SystemExit("project-defined mass-inventory QA gate failed")
              for value in (
                  row.normalized_residual,
                  row.momentum_inventory_relative_to_inlet,
                  row.energy_inventory_relative_to_inlet,
              ):
                  if not math.isfinite(value) or value < 0.0:
                      raise SystemExit("finite nonnegative diagnostic contract failed")
              if row.min_pressure_Pa <= 0.0 or row.min_temperature_K <= 0.0:
                  raise SystemExit("non-positive thermodynamic output")

          for cells in study.PROJECT_CELL_COUNTS:
              selected = sorted(
                  (row for row in points if row.cells == cells),
                  key=lambda row: row.target_inlet_mach,
              )
              air_per_mach = [
                  row.inlet_air_mass_flow_kg_per_s / row.target_inlet_mach
                  for row in selected
              ]
              fuel_per_mach = [
                  row.fuel_mass_source_kg_per_s / row.target_inlet_mach
                  for row in selected
              ]
              if max(air_per_mach) - min(air_per_mach) > 1.0e-13:
                  raise SystemExit("air mass flow is not proportional to target Mach")
              if max(fuel_per_mach) - min(fuel_per_mach) > 1.0e-13:
                  raise SystemExit("fuel mass flow is not proportional to target Mach")

          payload = study.assemble_study(points)
          payload["workflow_execution"] = {
              "solver_jobs_parallelized": True,
              "aggregation_reruns_solver": False,
          }
          if "fixed-static-state" not in payload["claim_boundary"]:
              raise SystemExit("P14 fixed-static-state claim boundary missing")
          if "No experimental validation" not in payload["claim_boundary"]:
              raise SystemExit("P14 validation claim boundary missing")

          Path("p14_project_defined_inlet_mach_sensitivity.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p14-project-defined-inlet-mach-sensitivity
          path: p14_project_defined_inlet_mach_sensitivity.json
