name: P10.2 Grid Convergence

on:
  workflow_dispatch:

jobs:
  formal-grid-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run exact-SHA 12-case P10.2 study
        run: python cases/verification/p10_2_grid_convergence.py
      - name: Upload P10.2 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-2-grid-convergence-${{ github.sha }}
          path: artifacts/p10_2/
          if-no-files-found: warn
          retention-days: 30
