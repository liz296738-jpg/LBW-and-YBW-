name: P11.2A Public Surrogate Formal Run

on:
  push:
    branches:
      - p11-2a-public-surrogate
    paths:
      - ".github/workflows/p11_2a_public_surrogate.yml"
      - "cases/studies/p11_2a_public_surrogate.py"
      - "cases/studies/data/p11_2_public_surrogate_source.json"
      - "src/**"
      - "tests/test_p11_2a_public_surrogate.py"
  workflow_dispatch:

jobs:
  formal-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run P11.2A focused tests
        run: pytest -q tests/test_p11_2a_public_surrogate.py
      - name: Run P11.2A formal baseline and isolator OFAT
        run: python cases/studies/p11_2a_public_surrogate.py --formal
      - name: Upload P11.2A formal results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p11-2a-public-surrogate-${{ github.sha }}
          path: results/p11_2a_public_surrogate/
          if-no-files-found: warn
          retention-days: 30
