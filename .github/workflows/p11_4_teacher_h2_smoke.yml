name: P11.4 Teacher H2 Integrated Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cases/studies/p11_4_project_defined_h2_smoke.py"
      - "src/scramjet1d/teacher_*.py"
      - "src/scramjet1d/variable_*.py"
      - "cases/studies/teacher_thermochemistry_database.py"
      - ".github/workflows/p11_4_teacher_h2_smoke.yml"

jobs:
  run-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run integrated H2 smoke case
        run: |
          python - <<'PY'
          from dataclasses import asdict
          import json
          from pathlib import Path
          from cases.studies.p11_4_project_defined_h2_smoke import run_smoke

          # This gate is intentionally a fast integrated smoke test. Higher-
          # resolution/tighter-tolerance cases belong to the subsequent grid study.
          result = run_smoke(cells=20, tolerance=1.0e-4, max_steps=8_000)
          payload = asdict(result)
          Path("p11_4_teacher_h2_smoke.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          if not result.converged:
              raise SystemExit("P11.4 integrated smoke case did not converge")
          if result.min_temperature_K <= 0.0 or result.min_pressure_Pa <= 0.0:
              raise SystemExit("P11.4 integrated smoke case produced a nonphysical state")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p11-4-teacher-h2-smoke
          path: p11_4_teacher_h2_smoke.json
          if-no-files-found: warn
