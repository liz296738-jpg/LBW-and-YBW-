name: P11.4 Conservation Audit

on:
  pull_request:
    paths:
      - 'cases/studies/p11_4_conservation_audit.py'
      - 'cases/studies/p11_4_project_defined_h2_smoke.py'
      - 'src/scramjet1d/**'
      - '.github/workflows/p11_4_conservation_audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Run 80-cell discrete conservation audit
        run: |
          python - <<'PY'
          from dataclasses import asdict
          import json
          from pathlib import Path
          from cases.studies.p11_4_conservation_audit import run_conservation_audit
          result = run_conservation_audit(cells=80, tolerance=2.0e-5, max_steps=20000)
          payload = asdict(result)
          Path('p11_4_conservation_audit.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, indent=2, sort_keys=True))
          if not result.converged:
              raise SystemExit('steady solve did not converge')
          # This gate checks that the stopped state has a small net mass inventory
          # rate relative to inlet flow. Momentum/energy are reported, not thresholded,
          # because their nonzero integrated RHS contains wall/geometry/injection effects.
          if result.mass_rate_relative_to_inlet > 5.0e-3:
              raise SystemExit('mass inventory rate exceeds 0.5% of inlet mass flow')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p11-4-conservation-audit
          path: p11_4_conservation_audit.json
